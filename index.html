<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引力透镜互动实验室 · Citizen Science</title>
<style>
  :root {
    --bg0: #0b0e1a; --bg1: #141931; --card: #181f36; --line: #2b3352;
    --text: #cdd3e0; --dim: #8b93ab; --accent: #7aa2ff; --ok: #4ce07a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 20% -10%, #1d2547 0%, var(--bg0) 55%),
                radial-gradient(900px 600px at 110% 110%, #251d47 0%, transparent 60%),
                var(--bg0);
    color: var(--text);
    font: 14.5px/1.6 "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; color: #eef1f8; }
  .sub { color: var(--dim); margin: 0 0 28px; }

  /* 登录状态卡 */
  .auth {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 26px;
  }
  .auth .who { flex: 1 1 240px; }
  .auth .who .name { color: #eef1f8; font-weight: 600; }
  .auth .who .hint { color: var(--dim); font-size: 12.5px; }
  button {
    cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: #1f2740; color: var(--text); padding: 7px 16px; font-size: 13.5px;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  button.primary { background: #2b57c9; border-color: #2b57c9; color: #fff; }
  button.primary:hover { background: #3565e6; }
  #authMsg { flex-basis: 100%; color: var(--dim); font-size: 12.5px; min-height: 1em; margin: 0; }
  #authMsg.err { color: #ff8484; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: #5a617a; margin-right: 7px; vertical-align: 1px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  /* 入口卡片 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; text-decoration: none; color: var(--text);
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card h2 { margin: 0; font-size: 17px; color: #eef1f8; }
  .card p { margin: 0; color: var(--dim); font-size: 13px; flex: 1; }
  .card .go { color: var(--accent); font-size: 13px; }
  footer { margin-top: 34px; color: #565e77; font-size: 12px; }
  footer a { color: #7c86a0; }

  /* 语言开关 */
  .langsw { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .langsw button {
    border: none; border-radius: 0; padding: 4px 14px; font-size: 12.5px;
    background: transparent; color: var(--dim);
  }
  .langsw button:hover { color: #fff; }
  .langsw button.lang-on { background: #2b57c9; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; justify-content:flex-end;">
    <div class="langsw">
      <button id="langZH" type="button">中文</button>
      <button id="langEN" type="button">EN</button>
    </div>
  </div>
  <h1 data-i18n="h1">引力透镜互动实验室</h1>
  <p class="sub" data-i18n="sub">强引力透镜物理演示与游戏化闯关 · 中国虚拟天文台公众科学平台应用</p>

  <div class="auth">
    <div class="who" id="who">
      <span class="dot"></span><span class="hint" data-i18n="checking">检查登录状态…</span>
    </div>
    <button id="btnLogin" type="button" class="primary" style="display:none" data-i18n="btnLogin">使用平台账号登录</button>
    <button id="btnLogout" type="button" style="display:none" data-i18n="btnLogout">退出登录</button>
    <p id="authMsg"></p>
  </div>

  <div class="cards">
    <a class="card" href="./strong-lensing.html">
      <h2 data-i18n="card1Title">强透镜仿真实验室</h2>
      <p data-i18n="card1Desc">源平面、透镜平面、Mock 巡天观测三画布实时联动，拖动参数观察爱因斯坦环、像拓扑与光路剖面，可叠加仪器效应模拟真实巡天成像。</p>
      <span class="go" data-i18n="card1Go">进入实验室 →</span>
    </a>
    <a class="card" href="./playground.html">
      <h2 data-i18n="card2Title">星系透镜探险</h2>
      <p data-i18n="card2Desc">游戏化闯关模式：用实时透镜特效把扭曲的像「复原」成源星系，三关挑战逐步进阶，成绩可记入你的参与记录。</p>
      <span class="go" data-i18n="card2Go">开始闯关 →</span>
    </a>
  </div>

  <footer data-i18n="footer">
    登录由 NADC 通行证提供（oauth.china-vo.org）。你的参与记录保存在本平台，可在门户「我的参与」中查看。
  </footer>
</div>

<script src="./config.js"></script>
<script src="./cs-client.js"></script>
<script>
(function () {
  "use strict";

  /* ===== 中英双语：与 strong-lensing / playground 共用 lensLang 记忆键 ===== */
  let LANG = localStorage.getItem("lensLang") || "zh";
  const TXT = {
    zh: {
      title: "引力透镜互动实验室",
      h1: "引力透镜互动实验室",
      sub: "强引力透镜物理演示与游戏化闯关 · 中国虚拟天文台公众科学平台应用",
      btnLogin: "使用平台账号登录",
      btnLogout: "退出登录",
      checking: "检查登录状态…",
      loggedOut: "未登录 — 登录后可保存参数配置并累计闯关记录",
      loggedIn: "已通过平台账号登录",
      card1Title: "强透镜仿真实验室",
      card1Desc: "源平面、透镜平面、Mock 巡天观测三画布实时联动，拖动参数观察爱因斯坦环、像拓扑与光路剖面，可叠加仪器效应模拟真实巡天成像。",
      card1Go: "进入实验室 →",
      card2Title: "星系透镜探险",
      card2Desc: "游戏化闯关模式：用实时透镜特效把扭曲的像「复原」成源星系，三关挑战逐步进阶，成绩可记入你的参与记录。",
      card2Go: "开始闯关 →",
      footer: "登录由 NADC 通行证提供（oauth.china-vo.org）。你的参与记录保存在本平台，可在门户「我的参与」中查看。",
      loginOk: "登录成功，令牌已就绪",
      logoutOk: "已退出登录",
      userFallback: "用户"
    },
    en: {
      title: "Gravitational Lensing Interactive Lab",
      h1: "Gravitational Lensing Interactive Lab",
      sub: "Strong lensing physics demo & gamified challenges · A China-VO Citizen Science app",
      btnLogin: "Sign in with platform account",
      btnLogout: "Sign out",
      checking: "Checking sign-in status…",
      loggedOut: "Not signed in — sign in to save your configuration and track challenge records",
      loggedIn: "Signed in with platform account",
      card1Title: "Strong Lensing Simulation Lab",
      card1Desc: "Three linked canvases (source plane, lens plane, mock survey) update in real time. Drag parameters to watch Einstein rings, image topology and ray paths, and overlay instrument effects to simulate real survey imaging.",
      card1Go: "Enter the lab →",
      card2Title: "Galaxy Lens Quest",
      card2Desc: "Gamified challenges: restore the distorted images back to the source galaxy with live lensing effects. Three stages of increasing difficulty, with results saved to your participation records.",
      card2Go: "Start the quest →",
      footer: "Sign-in is provided by the NADC passport (oauth.china-vo.org). Your participation records are stored on this platform and can be viewed under \"My Participation\" in the portal.",
      loginOk: "Signed in, token ready",
      logoutOk: "Signed out",
      userFallback: "User"
    }
  };
  function T(k) { return (TXT[LANG] && TXT[LANG][k]) !== undefined ? TXT[LANG][k] : TXT.zh[k] ?? k; }

  const whoEl = document.getElementById("who");
  const msgEl = document.getElementById("authMsg");
  const btnLogin = document.getElementById("btnLogin");
  const btnLogout = document.getElementById("btnLogout");

  /* 与官方 client.js 的存储键一致 */
  const TOKEN_KEY = CsClient.storageKey;

  /* 登录态记录：语言切换时按当前状态重渲染登录区 */
  let whoState = "checking"; /* checking | out | in */
  let whoName = "";

  function setMsg(text, isErr) {
    msgEl.textContent = text || "";
    msgEl.className = isErr ? "err" : "";
  }

  function renderLoggedOut() {
    whoState = "out";
    whoEl.innerHTML = '<span class="dot"></span><span class="hint">' + T("loggedOut") + "</span>";
    btnLogin.style.display = "";
    btnLogout.style.display = "none";
  }

  function renderLoggedIn(displayName) {
    whoState = "in";
    whoName = displayName;
    whoEl.innerHTML = '<span class="dot on"></span><span class="name">' + displayName +
      '</span> <span class="hint">' + T("loggedIn") + "</span>";
    btnLogin.style.display = "none";
    btnLogout.style.display = "";
  }

  function renderWho() {
    if (whoState === "out") renderLoggedOut();
    else if (whoState === "in") renderLoggedIn(whoName);
    else whoEl.innerHTML = '<span class="dot"></span><span class="hint">' + T("checking") + "</span>";
  }

  function applyLang(lang) {
    LANG = lang;
    localStorage.setItem("lensLang", lang);
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = T("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T(el.dataset.i18n); });
    const be = document.getElementById("langEN"), bz = document.getElementById("langZH");
    if (be && bz) { be.classList.toggle("lang-on", lang === "en"); bz.classList.toggle("lang-on", lang === "zh"); }
    renderWho();
  }

  document.getElementById("langZH").addEventListener("click", () => applyLang("zh"));
  document.getElementById("langEN").addEventListener("click", () => applyLang("en"));

  /* 读取令牌并拉取用户信息；401 时 client 内部自动用刷新令牌续期 */
  async function refreshIdentity() {
    const saved = sessionStorage.getItem(TOKEN_KEY);
    if (!saved) { renderLoggedOut(); return; }
    try {
      const me = await CsClient.api(window.CS_CONFIG, "/app/me", sessionStorage, fetch);
      renderLoggedIn(me.display_name || me.id || T("userFallback"));
    } catch (err) {
      /* 刷新也失败：令牌彻底失效，按未登录处理 */
      sessionStorage.removeItem(TOKEN_KEY);
      renderLoggedOut();
      setMsg(describe(err), true);
    }
  }

  function describe(value) {
    if (typeof value === "string") return value;
    if (value instanceof Error) return value.message || String(value);
    if (value && typeof value === "object") {
      if (typeof value.error_description === "string" && value.error_description) return value.error_description;
      const nested = value.error;
      if (nested && typeof nested === "object" && typeof nested.message === "string") return nested.message;
      if (typeof value.message === "string") return value.message;
    }
    return JSON.stringify(value);
  }

  /* 发起登录：生成 PKCE verifier 与 state，跳转授权页 */
  btnLogin.addEventListener("click", async () => {
    try {
      const verifier = CsClient.randomString();
      const state = CsClient.randomString();
      sessionStorage.setItem("cs_pkce_verifier", verifier);
      sessionStorage.setItem("cs_oauth_state", state);
      const challenge = await CsClient.sha256(verifier);
      window.location.assign(CsClient.authorizeUrl(window.CS_CONFIG, challenge, state));
    } catch (err) {
      setMsg(describe(err), true);
    }
  });

  btnLogout.addEventListener("click", () => {
    CsClient.logout(window.CS_CONFIG, sessionStorage, fetch)
      .then(() => { renderLoggedOut(); setMsg(T("logoutOk")); })
      .catch((err) => setMsg(describe(err), true));
  });

  /* OAuth 回调：带 state 的授权码（本地登录）或无 state 的门户启动码 */
  CsClient.finishRedirect(window.location.search, sessionStorage, window.CS_CONFIG || {}, fetch)
    .then((tokens) => {
      if (tokens) {
        window.history.replaceState({}, "", window.location.pathname);
        setMsg(T("loginOk"));
      }
      refreshIdentity();
    })
    .catch((err) => {
      if (new URLSearchParams(window.location.search).has("code")) {
        window.history.replaceState({}, "", window.location.pathname);
      }
      refreshIdentity();
      setMsg(describe(err), true);
    });

  /* 初始应用记忆的语言 */
  applyLang(LANG);
})();
</script>
</body>
</html>
